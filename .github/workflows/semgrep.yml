# Semgrep SAST on pull requests, with the same runner split as the AI review:
# public repos on GitHub-hosted `ubuntu-latest`, private repos on the owner's
# self-hosted runner. Semgrep Community Edition: no Semgrep account or token,
# the public `p/default` ruleset, metrics off.
#
# Findings are SARIF. Public repos upload them to the Security tab (code
# scanning is free there). Private repos need GitHub Code Security for that, so
# they always keep the SARIF as a workflow artifact and upload it only when the
# repo or org variable CODE_SECURITY_ENABLED is "true".
name: Semgrep

on:
  pull_request:
    # Re-scan each push so findings match the latest code (Semgrep runs
    # locally; no per-run API cost).
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # semgrep/semgrep 1.184.0 (multi-arch: amd64 + arm64), pinned by digest.
  # Run with `docker run`, not as the job's `container:`: the image is Alpine,
  # and the runner ships an Alpine build of Node 24 (which checkout,
  # upload-artifact and upload-sarif need) only for x64 — not for the arm64
  # self-hosted runner.
  SEMGREP_IMAGE: semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed

jobs:
  semgrep-public:
    if: >-
      github.event.repository.private == false &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --config p/default --metrics=off --sarif-output=semgrep.sarif
      - name: Upload to code scanning
        # Works for fork PRs on a public repo too: code scanning accepts SARIF
        # from pull_request runs despite their read-only token.
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  semgrep-private:
    # SECURITY CONTROL, not an optimization: this job runs on the owner's own
    # hardware, so it must never run for a public repo (where anyone can open
    # a PR) or for a fork PR. GitHub evaluates this `if` before a runner is
    # assigned, so a repo made public later skips the job. A second lock sits
    # outside the repo: the org runner group has "allow public repositories"
    # off. Semgrep reads the checked-out code; it doesn't execute it.
    # As in review-private.yml, this `if` can't stop a PR that edits this
    # file; the org's fork settings (forking private repos and running fork-PR
    # workflows, both off) are what keep fork PRs off the runner.
    if: >-
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, arm64, macmini]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --config p/default --metrics=off --sarif-output=semgrep.sarif
      - name: Keep the SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30
      - name: Upload to code scanning
        if: always() && vars.CODE_SECURITY_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
