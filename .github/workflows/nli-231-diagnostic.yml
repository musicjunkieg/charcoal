# TEMPORARY (#231). Delete once the fix has merged.
#
# ci.yml only triggers on main/staging, so a feature branch gets no x86_64
# signal — and x86_64 is the whole point of #231: the divergence was invisible
# on the dev machine's ARM64. This runs the NLI tests plus the characterization
# matrix on Linux x86_64 so the fix is verified on the platform production
# actually runs on, before the PR is opened.
name: "#231 NLI batch diagnostic"

on:
  workflow_dispatch:
  push:
    branches: [fix/231-nli-batch-divergence]

env:
  CARGO_TERM_COLOR: always

jobs:
  diagnose:
    name: NLI batch equivalence on Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Report CPU features
        run: |
          echo "arch: $(uname -m)"
          echo "avx2:      $(grep -c avx2 /proc/cpuinfo || true)"
          echo "avx512vnni:$(grep -c avx512_vnni /proc/cpuinfo || true)"
          echo "avxvnni:   $(grep -c avx_vnni /proc/cpuinfo || true)"

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Key includes download.rs, so the #231 model switch busts this cache and
      # the fp32 export is fetched by the real download path rather than a
      # hand-rolled curl — which also proves that path works.
      - name: Cache ONNX models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-charcoal-models-${{ hashFiles('src/toxicity/download.rs') }}

      - name: Download ONNX models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: cargo run --features web -- download-model
        env:
          CHARCOAL_MODEL_DIR: models

      - name: Confirm the fp32 export is what landed
        run: |
          ls -l models/nli-deberta-v3-xsmall/
          test -f models/nli-deberta-v3-xsmall/model.onnx \
            || { echo "fp32 model.onnx missing"; exit 1; }
          test ! -f models/nli-deberta-v3-xsmall/model_quantized.onnx \
            || { echo "stale quantized export was not removed"; exit 1; }

      # The gate: batched must equal single at 1e-4 on x86_64.
      - name: NLI batch-equivalence regression test
        run: |
          cargo test --lib --features web \
            scoring::nli::tests::batched_entailments_match -- --nocapture
        env:
          CHARCOAL_MODEL_DIR: models

      - name: Characterization matrix (for the record)
        run: |
          cargo test --lib --features web \
            scoring::nli::tests::characterize -- --ignored --nocapture
        env:
          CHARCOAL_MODEL_DIR: models

      - name: Full suite on x86_64, with skip check
        run: |
          cargo test --features web -- --show-output 2>&1 | tee /tmp/out.txt
          if grep -qE "SKIP:" /tmp/out.txt; then
            echo "::error::model-gated tests skipped on x86_64"
            grep -E "SKIP:" /tmp/out.txt
            exit 1
          fi
        env:
          CHARCOAL_MODEL_DIR: models
